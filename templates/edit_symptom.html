{% extends "base.html" %}

{% block title %}Edit symptoms - Health App{% endblock %}

{% block content %}
  <p><a href="/p/{{ profile.id }}">&larr; Back to profile page</a></p>

  <section class="card">
    <h2>Edit symptom entry</h2>
    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}
    <form action="/p/{{ profile.id }}/symptoms/{{ log.id }}/edit" method="post">
      <label>Date
        <input type="date" name="log_date" value="{{ values.log_date }}" required>
      </label>
      <p><strong>Symptoms</strong></p>
      <div class="checks">
        {% for opt in symptom_options %}
          <label>
            <input type="checkbox" name="symptoms" value="{{ opt }}"
                   {% if opt in values.symptoms %}checked{% endif %}>
            {{ opt }}
          </label>
        {% endfor %}
      </div>
      <label>Notes (optional)
        <textarea name="notes" rows="2" maxlength="500">{{ values.notes }}</textarea>
      </label>
      <button type="submit">Save changes</button>
    </form>
  </section>
{% endblock %}
