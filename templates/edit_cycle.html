{% extends "base.html" %}

{% block title %}Edit period - Health App{% endblock %}

{% block content %}
  <p><a href="/p/{{ profile.id }}">&larr; Back to profile page</a></p>

  <section class="card">
    <h2>Edit period entry</h2>
    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}
    <form action="/p/{{ profile.id }}/cycles/{{ entry.id }}/edit" method="post">
      <label>Period start date
        <input type="date" name="start_date" value="{{ values.start_date }}" required>
      </label>
      <label>Period end date (optional)
        <input type="date" name="end_date" value="{{ values.end_date }}">
      </label>
      <label>Notes (optional)
        <input type="text" name="notes" value="{{ values.notes }}">
      </label>
      <button type="submit">Save changes</button>
    </form>
  </section>
{% endblock %}
